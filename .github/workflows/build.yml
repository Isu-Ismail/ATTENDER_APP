# .github/workflows/build.yml

name: Build Windows Installer

on:
  push:
    branches:
      - main

jobs:
  build-exe-and-installer:
    if: "contains(github.event.head_commit.message, 'build')"
    runs-on: windows-latest
    
    # Permissions to allow creating releases
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon="app.ico" --name="attender" "main.py"

      # --- FIX IS HERE ---
      # Switched to the reliable 'joncloud' action
      - name: Set up NSIS
        uses: joncloud/setup-nsis@v1
      # -------------------

      - name: Create installer with NSIS
        run: |
          makensis installer.nsi
          
      - name: Set up version tag
        id: version
        run: |
          $version = "v1.0.${{ github.run_number }}"
          echo "version_tag=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: "Release ${{ steps.version.outputs.version_tag }}"
          files: |
            dist/attender-setup.exe